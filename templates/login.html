<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <style>
#content * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

#content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.2rem;
    width: 100%;
    max-width: 400px;
    margin: 10rem auto;
    padding: 2rem;
    border: 1px solid rgba(0, 0, 0, 0.1);
    border-radius: 12px;
    background-color: white;
    font-family: 'Arial', 'Helvetica', sans-serif;
}

#content input {
    width: 100%;
    padding: 0.8rem 1rem;
    border: 2px solid black;
    background: white;
    color: black;
    font-size: 1rem;
    border-radius: 6px;
    transition: border-color 0.2s ease;
}

#content input:focus {
    outline: none;
    border-color: rgba(0, 0, 0, 0.4); 
}

#content button {
    width: 100%;
    padding: 0.9rem 2.5rem;
    border: 2px solid black;
    background-color: transparent;
    color: black;
    font-size: 1.2rem;
    font-weight: 600;
    border-radius: 40px;         
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 0.5rem;
}

#content button:hover {
    background-color: black;
    color: white;
    border-color: black;
    transform: scale(1.05);      
}

.user_states {
    margin-top: 0.5rem;
    font-size: 0.9rem;
    color: rgba(0, 0, 0, 0.6);
    text-align: center;
    border-top: 1px dashed rgba(0, 0, 0, 0.2);
    padding-top: 1rem;
    width: 100%;
}
    </style>
</head>
<body>

    <div id="page">
        <div id="content">
        <input placeholder="Ваша почта" type="email"  id="email" required>
        <input placeholder="Ваш пароль" type="text"  id="password" required>
        <button onclick="send_info()">Войти</button>
    <p class="user_states">
      {{ user_states }}
    </p>
    </div>
    </div>

    <script>
    function send_info(){
        let email = document.getElementById('email');
        let password = document.getElementById('password');
        let email_in;
        let pas_in;
        email_in = email.value;
        pas_in = password.value;
        let info;
            info = {
                'email':email_in,
                'password':pas_in
                };
        fetch('/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json' 
                },
            body: JSON.stringify(info)
                })
        .then(response => response.text())
        .then(html => {
            document.getElementById('page').innerHTML = html; // Меняем часть страницы
            });
    };
    </script>

</body>
</html>
