<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: white;
    color: black;
    font-family: 'Arial', 'Helvetica', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 1rem;
}

.hello_container {
    text-align: center;
    margin-bottom: 2.5rem;
}

.hello_container h2 {
    font-size: 2.2rem;
    font-weight: 300;
    letter-spacing: 1px;
    margin-bottom: 0.5rem;
    color: black; 
}

.hello_container h3 {
    font-size: 1.2rem;
    font-weight: 400;
    color: rgba(0, 0, 0, 0.75); 
}

.variants_container {
    display: flex;
    gap: 1.5rem;
    justify-content: center;
    flex-wrap: wrap;
    margin: 2rem 0;
}

.variants_container a {
    display: inline-block;
    padding: 0.9rem 2.5rem;
    border: 2px solid black;
    background-color: transparent;
    color: black;
    text-decoration: none;
    font-size: 1.2rem;
    font-weight: 600;
    border-radius: 40px;          
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.variants_container a:hover {
    background-color: black;
    color: white;
    border-color: black;
    cursor: pointer;
    transform: scale(1.05);
}


footer {
    margin-top: 4rem;
    font-size: 0.9rem;
    color: rgba(0, 0, 0, 0.65);  
    text-align: center;
    border-top: 1px solid rgba(0, 0, 0, 0.15);
    padding-top: 1.5rem;
    width: 100%;
    max-width: 600px;
    line-height: 1.5;
}

      
    </style>
</head>
<body>
    <div class="hello_container">
        <h2>Вас приветсвует приложение для коммуникаций!</h2>
        <h3>Выберите один из вариантов представленных ниже</h3>
    </div>
    
    <div class="variants_container">
        <a href="/login">Войти</a>
        <a href="/reg">Зарегистрироватся</a>
        <p>
            <a id="iwlth"></a>
        </p>
    </div>
    

    <footer>
        Создатель: Дернятин Георгий 
        <br>Почта: georgydernyatin@yandex.ru
    </footer>

    <script>
        let user_id = localStorage.getItem('user_id');
        const iwlth = document.getElementById('iwlth');

        if (user_id != null) {
            iwlth.textContent = 'Нажмите, если вы уже входили в аккаунт на этом устройстве'
            iwlth.setAttribute('href', `/main_page/${user_id}`);
            }
    </script>
    
</body>
</html>
