
    
    <style>
    .container * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        width: 100%;
        max-width: 600px;
        margin: 2rem auto;
        padding: 2.5rem 2rem;
        background-color: white;
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 12px;
        font-family: 'Arial', 'Helvetica', sans-serif;
        text-align: center;
    }

    .container h1 {
        font-size: 2rem;
        font-weight: 300;
        letter-spacing: 1px;
        color: black;
        margin-bottom: 0.5rem;
        line-height: 1.3;
    }

    .container a {
        display: inline-block;
        padding: 0.9rem 2.5rem;
        border: 2px solid black;
        background-color: transparent;
        color: black;
        text-decoration: none;
        font-size: 1.2rem;
        font-weight: 600;
        border-radius: 40px;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
    }

    .container a:hover {
        background-color: black;
        color: white;
        border-color: black;
        transform: scale(1.05);
    }

    </style>

    <div class="container">
         <h1>Авторизация прошла успешно!</h1>
        <a href="/main_page/{{ user_id }}" onclick="localStorage.setItem('user_states_login', true);localStorage.setItem('user_id', {{user_id}});localStorage.setItem('token', '{{token}}'); localStorage.setItem('first_name', '{{first_name}}'); localStorage.setItem('last_name', '{{last_name}}');localStorage.setItem('email', '{{email}}')" >Продолжить</a>
    </div>
